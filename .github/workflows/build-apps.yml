# Builds the PopcornTime native shells for all three targets on their proper
# runners. Trigger manually (workflow_dispatch) or by pushing a v* tag.
#
#   android  → PopcornTime-debug.apk      (Capacitor, any Android 6+ device)
#   windows  → .msi / -setup.exe x64      (Tauri, Windows 10/11)
#   macos    → .dmg / .app aarch64        (Tauri, Apple Silicon M1/M2/M3/M4)
#
# All shells wrap https://pocorntime.antideploy.app, so site fixes ship without
# rebuilding these binaries.
name: build-apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (PopcornTime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/mobile-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/mobile-capacitor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 7 / AGP 8.7 require JDK 21
      # no android-actions/setup-android: the ubuntu runner ships a complete
      # SDK, and the action's default `packages: tools platform-tools` now
      # crashes — Google removed the legacy `tools` package from sdkmanager.
      # Gradle auto-installs any missing platform/build-tools (licenses
      # pre-accepted on runner images).
      - run: npm ci
      # android/ is gitignored (generated); recreate it on the runner
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-android-debug-apk
          path: native/mobile-capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows x64 (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: native/desktop-tauri
          args: --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-windows-x64
          path: |
            native/desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            native/desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon (DMG)
    runs-on: macos-14 # M1 — native aarch64 build for M-chip Macs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: native/desktop-tauri
          args: --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-macos-apple-silicon
          path: |
            native/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            native/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
