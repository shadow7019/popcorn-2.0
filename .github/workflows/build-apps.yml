# Builds the PopcornTime native shells for all targets on their proper
# runners. Trigger manually (workflow_dispatch) or by pushing a v* tag.
#
#   android      → PopcornTime-debug.apk   (Capacitor, any Android 6+ device)
#   windows      → .msi / -setup.exe x64   (Tauri, Windows 10/11)
#   macos        → light DMG+ZIP universal (Tauri shell, ~6 MB — loads the hosted site)
#   macos-full-* → SELF-CONTAINED DMGs     (Electron + the whole site bundled,
#                  arm64 + x64, ~200-300 MB — the OTAMA-style build)
#   ios          → unsigned .ipa (Capacitor; sideload with AltStore/Sideloadly)
#
# The light shell wraps https://popcorntime.antideploy.app, so site fixes ship
# without rebuilding it. The full Electron builds embed the site's standalone
# output (webtorrent engine in-process, Prisma/SQLite, TMDB key baked into the
# source) so they run with zero external services — same architecture as the
# old OTAMA desktop app. All mac bundles are ad-hoc signed (codesign "-") so
# Gatekeeper shows the bypassable "cannot verify" dialog instead of "damaged".
# The ipa is unsigned by design: end users sign it with their own Apple ID via
# Sideloadly/AltStore, or install as-is with TrollStore.
name: build-apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (PopcornTime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/mobile-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/mobile-capacitor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 7 / AGP 8.7 require JDK 21
      # no android-actions/setup-android: the ubuntu runner ships a complete
      # SDK, and the action's default `packages: tools platform-tools` now
      # crashes — Google removed the legacy `tools` package from sdkmanager.
      # Gradle auto-installs any missing platform/build-tools (licenses
      # pre-accepted on runner images).
      - run: npm ci
      # android/ is gitignored (generated); recreate it on the runner
      - run: npx cap add android
      - run: npm run assets
      - run: npx cap sync android
      - run: cd android && bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-android-debug-apk
          path: native/mobile-capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows x64 (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: native/desktop-tauri
          args: --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-windows-x64
          path: |
            native/desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            native/desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal (DMG + ZIP)
    runs-on: macos-14 # M1 — hosts both aarch64 and x86_64 toolchains
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      # universal-apple-darwin: tauri builds both arches and lipo-merges them,
      # so ONE DMG runs on Apple Silicon (M1-M5) AND Intel Macs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: native/desktop-tauri
          args: --target universal-apple-darwin --bundles app
      - name: Ad-hoc deep sign the app bundle
        run: |
          APP="native/desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/PopcornTime.app"
          codesign --deep --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | head -4
          echo "architectures: $(lipo -archs "$APP/Contents/MacOS/PopcornTime")"
      - name: Create DMG + ZIP with hdiutil and smoke-test mounting
        run: |
          APP="native/desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/PopcornTime.app"
          DMG="PopcornTime-1.0.4-macos-universal.dmg"
          ZIP="PopcornTime-1.0.4-macos-universal.zip"
          hdiutil create -volname PopcornTime -srcfolder "$APP" -ov -format UDZO "$DMG"
          hdiutil attach -readonly -nobrowse "$DMG" -mountpoint /tmp/pt_mount
          ls /tmp/pt_mount
          test -d "/tmp/pt_mount/PopcornTime.app"
          hdiutil detach /tmp/pt_mount
          hdiutil verify "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          unzip -l "$ZIP" | head -6
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-macos-universal
          path: |
            PopcornTime-1.0.4-macos-universal.dmg
            PopcornTime-1.0.4-macos-universal.zip
          if-no-files-found: error
      - name: Attach macOS builds to v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release upload v1.0.0 \
              "PopcornTime-1.0.4-macos-universal.dmg" \
              "PopcornTime-1.0.4-macos-universal.zip" \
              --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            echo "upload attempt $i failed; retrying in 20s"; sleep 20
          done
          exit 1

  # ---- Self-contained Electron builds (OTAMA-style, the whole site inside) ----
  # Two jobs because node-datachannel (webtorrent's WebRTC backend) downloads
  # ONE arch-specific binary at install time: the x64 job swaps it via
  # prebuild-install so the Intel DMG carries a working native module.
  macos-full-arm64:
    name: macOS full DMG — Apple Silicon (Electron)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install web app dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install desktop build dependencies (electron + electron-builder)
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          # npm's install-script policy can block electron's postinstall — ensure the binary lands
          if [ ! -f "node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" ]; then
            node node_modules/electron/install.js
          fi
      - name: Build web UI into standalone renderer
        working-directory: desktop
        env:
          DATABASE_URL: file:./db/build-placeholder.db
        run: node scripts/prepare-renderer.mjs
      - name: Smoke-test the standalone renderer (API must answer JSON)
        run: |
          cd desktop/resources/renderer
          DATABASE_URL="file:$(pwd)/../popcorntime-template.db" PORT=3999 HOSTNAME=127.0.0.1 node server.js &
          SRV=$!
          ok=""
          for i in $(seq 1 45); do
            curl -sf "http://127.0.0.1:3999/api/catalog?type=movie&skip=0" -o /tmp/smoke.json && ok=1 && break
            sleep 2
          done
          kill $SRV 2>/dev/null || true
          if [ -z "$ok" ]; then echo "renderer API smoke test FAILED"; exit 1; fi
          echo "smoke ok:"; head -c 160 /tmp/smoke.json; echo
      - name: Patch electron-builder (allow node_modules in extraResources)
        working-directory: desktop
        run: node scripts/patch-builder.mjs
      - name: Package DMG (arm64, ad-hoc signed in afterPack)
        working-directory: desktop
        run: npx electron-builder --mac dmg --arm64 --publish never
      - name: DMG checksum
        working-directory: desktop/dist
        run: shasum -a 256 PopcornTime-1.0.5-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-macos-full-arm64
          path: desktop/dist/PopcornTime-1.0.5-arm64.dmg
          if-no-files-found: error
      - name: Attach full arm64 DMG to v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release upload v1.0.0 "desktop/dist/PopcornTime-1.0.5-arm64.dmg" \
              --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            echo "upload attempt $i failed; retrying in 20s"; sleep 20
          done
          exit 1

  macos-full-x64:
    name: macOS full DMG — Intel (Electron)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install web app dependencies
        run: npm ci --no-audit --no-fund
      - name: Swap node-datachannel native binary to x64 (Intel DMG)
        run: |
          cd node_modules/node-datachannel
          npx prebuild-install -r napi --arch x64 --platform darwin
          file build/Release/node_datachannel.node
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install desktop build dependencies (electron + electron-builder)
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          if [ ! -f "node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" ]; then
            node node_modules/electron/install.js
          fi
      - name: Build web UI into standalone renderer
        working-directory: desktop
        env:
          DATABASE_URL: file:./db/build-placeholder.db
        run: node scripts/prepare-renderer.mjs
      - name: Patch electron-builder (allow node_modules in extraResources)
        working-directory: desktop
        run: node scripts/patch-builder.mjs
      - name: Package DMG (x64, ad-hoc signed in afterPack)
        working-directory: desktop
        run: npx electron-builder --mac dmg --x64 --publish never
      - name: DMG checksum
        working-directory: desktop/dist
        run: shasum -a 256 PopcornTime-1.0.5-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-macos-full-x64
          path: desktop/dist/PopcornTime-1.0.5-x64.dmg
          if-no-files-found: error
      - name: Attach full x64 DMG to v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release upload v1.0.0 "desktop/dist/PopcornTime-1.0.5-x64.dmg" \
              --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            echo "upload attempt $i failed; retrying in 20s"; sleep 20
          done
          exit 1

  ios:
    name: iOS unsigned IPA (sideload)
    runs-on: macos-15 # Xcode 16 for Capacitor 7
    defaults:
      run:
        working-directory: native/mobile-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/mobile-capacitor/package-lock.json
      - run: npm ci
      # ios/ is gitignored (generated); recreate it on the runner
      - run: npx cap add ios
      - run: npm run assets
      - run: npx cap sync ios
      - run: cd ios/App && pod install
      - name: Archive app unsigned
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          cd ios/App
          APP_PATH="$(ls -d build/App.xcarchive/Products/Applications/*.app)"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PopcornTime-1.0.3-ios-unsigned.ipa Payload
          unzip -l PopcornTime-1.0.3-ios-unsigned.ipa | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: PopcornTime-ios-unsigned-ipa
          path: native/mobile-capacitor/ios/App/PopcornTime-1.0.3-ios-unsigned.ipa
          if-no-files-found: error
      - name: Attach IPA to v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release upload v1.0.0 "ios/App/PopcornTime-1.0.3-ios-unsigned.ipa" \
              --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            echo "upload attempt $i failed; retrying in 20s"; sleep 20
          done
          exit 1
